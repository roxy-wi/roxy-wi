---
- name: Install NGINX WAF
  block:
    - name: Require a directory supported by ModSecurity Include directives
      ansible.builtin.assert:
        that: SERVICE_PATH is match('^/[A-Za-z0-9_./:-]+$')
        fail_msg: "ModSecurity requires nginx_dir to use ASCII letters, digits or / _ . : - characters, without spaces or quotes."

    - name: Check the current NGINX configuration and loaded modules
      ansible.builtin.command:
        argv: [nginx, -T, -c, "{{ NGINX_CONFIG_PATH }}"]
      register: waf_nginx_dump
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require a valid NGINX configuration before installation
      ansible.builtin.assert:
        that: waf_nginx_dump.rc == 0
        fail_msg: "Cannot inspect NGINX. Check the configured main file with nginx -t before installing WAF."

    - name: Detect an already loaded ModSecurity connector
      ansible.builtin.set_fact:
        waf_nginx_module_loaded: "{{ waf_nginx_dump.stdout is search('(?m)^\\s*load_module\\s+[^;\\n]*ngx_http_modsecurity_module[.]so') }}"
      no_log: true

    - name: Create a private installation workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: roxywi-waf-nginx-install-
      register: waf_nginx_work

    - name: Build the connector for the installed NGINX binary
      ansible.builtin.include_tasks: build_module.yml
      when: not waf_nginx_module_loaded

    - name: Create WAF directories
      ansible.builtin.file:
        path: "{{ SERVICE_PATH }}/waf/{{ item }}"
        state: directory
        mode: '0755'
      loop: ['', rules]

    - name: Download the versioned initial ModSecurity configuration
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/owasp-modsecurity/ModSecurity/v{{ modsecurity_ver }}/modsecurity.conf-recommended"
        dest: "{{ waf_nginx_work.path }}/modsecurity.conf"
        mode: '0600'

    - name: Use the absolute Unicode mapping path
      ansible.builtin.lineinfile:
        path: "{{ waf_nginx_work.path }}/modsecurity.conf"
        regexp: '^SecUnicodeMapFile\s+'
        line: 'SecUnicodeMapFile {{ SERVICE_PATH }}/waf/unicode.mapping 20127'

    - name: Install initial configuration without resetting existing settings
      ansible.builtin.copy:
        src: "{{ waf_nginx_work.path }}/modsecurity.conf"
        dest: "{{ SERVICE_PATH }}/waf/modsecurity.conf"
        remote_src: true
        force: false
        mode: '0644'

    - name: Download the raw Unicode mapping
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/owasp-modsecurity/ModSecurity/v{{ modsecurity_ver }}/unicode.mapping"
        dest: "{{ SERVICE_PATH }}/waf/unicode.mapping"
        force: false
        mode: '0644'

    - name: Create the initial rules entrypoint
      ansible.builtin.template:
        src: waf.conf.j2
        dest: "{{ SERVICE_PATH }}/waf/waf.conf"
        force: false
        mode: '0644'

    - name: Download OWASP rules
      ansible.builtin.get_url:
        url: "https://github.com/coreruleset/coreruleset/archive/v{{ coreruleset_ver }}.tar.gz"
        dest: "{{ waf_nginx_work.path }}/OWASP.tar.gz"
        mode: '0600'

    - name: Extract OWASP rules
      ansible.builtin.unarchive:
        src: "{{ waf_nginx_work.path }}/OWASP.tar.gz"
        dest: "{{ waf_nginx_work.path }}"
        remote_src: true

    - name: Find the distributed CRS rule and data files
      ansible.builtin.find:
        paths: "{{ waf_nginx_work.path }}/coreruleset-{{ coreruleset_ver }}/rules"
        file_type: file
      register: waf_nginx_crs_files

    - name: Install missing CRS files without overwriting user edits
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ SERVICE_PATH }}/waf/rules/{{ item.path | basename }}"
        remote_src: true
        force: false
        mode: '0644'
      loop: "{{ waf_nginx_crs_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Install the initial CRS settings
      ansible.builtin.copy:
        src: "{{ waf_nginx_work.path }}/coreruleset-{{ coreruleset_ver }}/crs-setup.conf.example"
        dest: "{{ SERVICE_PATH }}/waf/rulescrs-setup.conf"
        remote_src: true
        force: false
        mode: '0644'

    - name: Configure NGINX WAF audit logs and rotation
      ansible.builtin.include_role:
        name: waf_logs
      vars:
        waf_log_service: nginx

    - name: Connect and validate WAF
      ansible.builtin.include_tasks: nginx_config.yml

  always:
    - name: Remove the private installation workspace
      ansible.builtin.file:
        path: "{{ waf_nginx_work.path }}"
        state: absent
      when: waf_nginx_work.path is defined
