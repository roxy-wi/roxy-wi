---
- name: Write a private environment file instead of embedding secrets in systemd commands
  ansible.builtin.template:
    src: container_environment.j2
    dest: "/etc/roxy-wi/{{ roxywi_install.component }}-container.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Write the Podman systemd definition
  containers.podman.podman_container:
    name: "{{ roxywi_service_unit }}"
    image: "{{ roxywi_install.image }}"
    hostname: "{{ ansible_facts.hostname }}"
    network: host
    env_file:
      - "/etc/roxy-wi/{{ roxywi_install.component }}-container.env"
    volume: "{{ roxywi_container_volumes }}"
    state: quadlet
    quadlet_filename: "{{ roxywi_container_unit }}"
    quadlet_file_mode: '0600'
    quadlet_options:
      - |
        [Service]
        Restart=on-failure
      - |
        [Install]
        WantedBy=multi-user.target
  when: roxywi_service_engine == 'podman'
  no_log: true

- name: Apply Podman startup settings
  ansible.builtin.systemd_service:
    name: "{{ roxywi_container_unit }}.service"
    daemon_reload: true
    state: restarted
  when: roxywi_service_engine == 'podman'
