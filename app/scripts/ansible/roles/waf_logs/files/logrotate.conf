# Separate from the distribution's nginx/*.log policy and daily rotation state.
/var/log/haproxy/waf/audit.log /var/log/nginx/waf/audit.log {
    daily
    maxsize 50M
    rotate 7
    missingok
    notifempty
    compress
    nodateext
    su root root
    # The SPOA agent has no reopen signal; retain its open file descriptor.
    # This also avoids reloading NGINX just to reopen ModSecurity's audit file.
    copytruncate
}
