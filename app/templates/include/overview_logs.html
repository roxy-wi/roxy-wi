{% from 'languages/en.html' import log_viewer as log_fallback %}
{% set lt = lang.log_viewer|default(log_fallback) %}
<link rel="stylesheet" href="{{url_for('static', filename='css/log-viewer.css')}}">
<table id="overview-logs" class="overview-wi" data-text='{{lt|tojson}}' aria-labelledby="overview-log-title">
    <thead>
        <tr class="overviewHead">
            <td class="padding10 first-collumn-wi">
                <a id="overview-log-title" href="{{url_for('logs.logs_internal', type=2)}}">{{lang.words.recent|title()}} Roxy-WI {{lang.words.logs}}</a>
            </td>
            <td>
                <button id="overview-log-expand" class="add-button-wi" type="button" aria-expanded="false" aria-controls="overview-log-output" data-show="{{lang.words.show_more}}" data-hide="{{lang.words.show_less}}" hidden>{{lang.words.show_more}}</button>
            </td>
            <td class="padding10">
                <button id="overview-log-refresh" class="add-button-wi" type="button" aria-label="{{lt.refresh}}" title="{{lt.refresh}}"><span class="refresh" aria-hidden="true"></span></button>
            </td>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td colspan="3">
                <div id="overview-log-status" class="log-statusbar" role="status" aria-live="polite">{{lt.loading}}</div>
                <div id="overview-log-output" class="log-output" tabindex="0" aria-label="{{lang.words.logs|title()}}"></div>
            </td>
        </tr>
    </tbody>
</table>
<script src="{{url_for('static', filename='js/log-viewer.js')}}"></script>
<script src="{{url_for('static', filename='js/overview-logs.js')}}"></script>
