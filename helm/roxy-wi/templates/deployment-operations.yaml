{{- if .Values.operations.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roxy-wi.fullname" . }}-operations
  labels:
    {{- include "roxy-wi.labels" . | nindent 4 }}
    app.kubernetes.io/component: operations
spec:
  replicas: {{ .Values.operations.replicaCount }}
  selector:
    matchLabels:
      {{- include "roxy-wi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operations
  template:
    metadata:
      annotations:
        {{- include "roxy-wi.configChecksum" . | nindent 8 }}
        {{- include "roxy-wi.runtimeChecksum" . | nindent 8 }}
        {{- with .Values.operations.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "roxy-wi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operations
        {{- with .Values.operations.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.operations.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      serviceAccountName: {{ include "roxy-wi.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "roxy-wi.waitForDatabase" . | nindent 8 }}
      containers:
        - name: operations
          image: {{ include "roxy-wi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["operations"]
          env:
            {{- include "roxy-wi.commonEnv" . | nindent 12 }}
            - name: ROXYWI_OPERATIONS_LEASE_SECONDS
              value: {{ .Values.operations.leaseSeconds | quote }}
            {{- with .Values.operations.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $envFrom := include "roxy-wi.commonEnvFrom" . }}
          {{- if $envFrom }}
          envFrom:
            {{- $envFrom | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.operations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "roxy-wi.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "roxy-wi.volumes" . | nindent 8 }}
      {{- with .Values.operations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- $defaultAffinity := include "roxy-wi.dataWorkerAffinity" $ }}
      {{- if $defaultAffinity }}
      affinity:
        {{- $defaultAffinity | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.operations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
