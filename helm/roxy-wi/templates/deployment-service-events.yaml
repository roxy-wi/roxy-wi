{{- if .Values.serviceEvents.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roxy-wi.fullname" . }}-service-events
  labels:
    {{- include "roxy-wi.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-events
spec:
  replicas: {{ .Values.serviceEvents.replicaCount }}
  selector:
    matchLabels:
      {{- include "roxy-wi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: service-events
  template:
    metadata:
      annotations:
        {{- include "roxy-wi.configChecksum" . | nindent 8 }}
        {{- include "roxy-wi.runtimeChecksum" . | nindent 8 }}
        {{- with .Values.serviceEvents.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "roxy-wi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: service-events
        {{- with .Values.serviceEvents.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "roxy-wi.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "roxy-wi.waitForDatabase" . | nindent 8 }}
      containers:
        - name: service-events
          image: {{ include "roxy-wi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["service-events"]
          {{- include "roxy-wi.workerProbes" "service-events" | nindent 10 }}
          env:
            {{- include "roxy-wi.commonEnv" . | nindent 12 }}
            {{- with .Values.serviceEvents.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $envFrom := include "roxy-wi.commonEnvFrom" . }}
          {{- if $envFrom }}
          envFrom:
            {{- $envFrom | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.serviceEvents.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "roxy-wi.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "roxy-wi.volumes" . | nindent 8 }}
      {{- with .Values.serviceEvents.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceEvents.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- $defaultAffinity := include "roxy-wi.dataWorkerAffinity" $ }}
      {{- if $defaultAffinity }}
      affinity:
        {{- $defaultAffinity | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.serviceEvents.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
