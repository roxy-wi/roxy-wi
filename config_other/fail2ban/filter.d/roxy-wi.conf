# Fail2Ban roxy-wi filter
#

[Definition]

# Mode for filter: normal (default) and aggressive (allows DDoS & brute force detection of mod_evasive)
mode = normal

# Only the formatter's reserved leading event field can identify a client.
# Paths, exceptions and ordinary messages are untrusted JSON strings.
failregex = ^\{"authentication_failure": \{"ip": "<ADDR>"\},

ignoreregex =

