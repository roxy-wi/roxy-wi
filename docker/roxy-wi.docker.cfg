[main]
fullpath = /var/www/haproxy-wi
log_path = /var/log/roxy-wi
lib_path = /var/lib/roxy-wi
secret_phrase = CHANGE_ME
deployment_mode = compose
auto_migrate = 0
jwt_algorithm = HS256

[configs]
haproxy_save_configs_dir = ${main:lib_path}/configs/hap_config/
keepalived_save_configs_dir = ${main:lib_path}/configs/kp_config/
nginx_save_configs_dir = ${main:lib_path}/configs/nginx_config/
apache_save_configs_dir = ${main:lib_path}/configs/apache_config/

[mysql]
enable = 0
mysql_user = roxy-wi
mysql_password = roxy-wi
mysql_db = roxywi
mysql_host = mariadb
mysql_port = 3306

[sqlite]
path = ${main:lib_path}/roxy-wi.db

[cache]
type = NullCache

[logs]
log_console = 1
log_file_enabled = 0
log_level = INFO

[proxy]
enabled = 1
x_for = 1
x_proto = 1
x_host = 1
x_port = 1
x_prefix = 0

[ansible]
private_data_dir = ${main:lib_path}/ansible
roles_path = ${main:lib_path}/ansible/roles
collections_path = ${main:lib_path}/ansible/collections
