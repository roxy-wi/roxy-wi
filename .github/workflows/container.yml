name: Container

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-check:
    name: Helm ${{ matrix.helm-version }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version: [v3.21.3, v4.2.3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ matrix.helm-version }}

      - name: Lint and render SQLite chart
        run: |
          helm lint helm/roxy-wi \
            --set-string config.main.secret_key=container-ci-secret-key-with-at-least-32-characters \
            --set-string config.main.secret_phrase=E2nCq8NnECvPQ5zUQntL_-Nt-qBncYkrEmMkYGzVpyM= \
            --set-string rabbitmq.password=container-ci-rabbitmq-password
          helm template roxy-wi helm/roxy-wi \
            --namespace roxy-wi \
            --set-string config.main.secret_key=container-ci-secret-key-with-at-least-32-characters \
            --set-string config.main.secret_phrase=E2nCq8NnECvPQ5zUQntL_-Nt-qBncYkrEmMkYGzVpyM= \
            --set-string rabbitmq.password=container-ci-rabbitmq-password \
            > /tmp/roxy-wi-sqlite.yaml
          test -s /tmp/roxy-wi-sqlite.yaml

      - name: Render HA chart
        run: |
          helm template roxy-wi helm/roxy-wi \
            --namespace roxy-wi \
            --set-string config.main.secret_key=container-ci-secret-key-with-at-least-32-characters \
            --set-string config.main.secret_phrase=E2nCq8NnECvPQ5zUQntL_-Nt-qBncYkrEmMkYGzVpyM= \
            --set-string config.database.engine=mysql \
            --set web.replicaCount=2 \
            --set persistence.accessModes[0]=ReadWriteMany \
            --set-string rabbitmq.password=container-ci-rabbitmq-password \
            > /tmp/roxy-wi-ha.yaml
          test -s /tmp/roxy-wi-ha.yaml

  build-and-sqlite-smoke:
    needs: helm-check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build --file docker/Dockerfile --tag roxy-wi:test .

      - name: Initialize SQLite database
        run: |
          docker volume create roxy-wi-smoke-data
          docker run --rm \
            --volume roxy-wi-smoke-data:/var/lib/roxy-wi \
            --env ROXYWI_DEPLOYMENT_MODE=compose \
            --env ROXYWI_DATABASE_ENGINE=sqlite \
            --env ROXYWI_DB_PATH=/var/lib/roxy-wi/roxy-wi.db \
            --env ROXYWI_SECRET_KEY=container-smoke-secret-key-with-at-least-32-characters \
            --env ROXYWI_SECRET_PHRASE=E2nCq8NnECvPQ5zUQntL_-Nt-qBncYkrEmMkYGzVpyM= \
            --env ROXYWI_JWT_ALGORITHM=HS256 \
            --env ROXYWI_BOOTSTRAP_ADMIN_PASSWORD=ContainerSmokeAdminPassword! \
            roxy-wi:test migrate

      - name: Start container and verify readiness
        run: |
          docker run --detach --name roxy-wi-smoke \
            --publish 18080:8080 \
            --volume roxy-wi-smoke-data:/var/lib/roxy-wi \
            --env ROXYWI_DEPLOYMENT_MODE=compose \
            --env ROXYWI_DATABASE_ENGINE=sqlite \
            --env ROXYWI_DB_PATH=/var/lib/roxy-wi/roxy-wi.db \
            --env ROXYWI_SECRET_KEY=container-smoke-secret-key-with-at-least-32-characters \
            --env ROXYWI_SECRET_PHRASE=E2nCq8NnECvPQ5zUQntL_-Nt-qBncYkrEmMkYGzVpyM= \
            --env ROXYWI_JWT_ALGORITHM=HS256 \
            roxy-wi:test web
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs roxy-wi-smoke
          exit 1

      - name: Clean up smoke resources
        if: always()
        run: |
          docker rm --force roxy-wi-smoke 2>/dev/null || true
          docker volume rm roxy-wi-smoke-data 2>/dev/null || true

      - name: Verify role probes and dependency outage recovery
        run: python3 tests/container_health_smoke.py

      - name: Verify documented quick start and HTTPS login after restart
        run: python3 tests/quickstart_smoke.py
