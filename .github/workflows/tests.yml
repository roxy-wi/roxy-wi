name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  service-json-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install log format test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y haproxy nginx rsyslog
          python -m pip install Jinja2
      - name: Verify real JSON logs on isolated loopback listeners
        env:
          ROXYWI_TEST_SERVICE_LOGS: '1'
        run: python tests/integration/test_service_json_logs.py
      - name: Verify incremental reads and rotation on Linux
        run: python tests/integration/test_remote_log_reader.py

  le-linux-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server openssl fail2ban
          python -m pip install -r requirements.txt -r requirements-dev.txt
          docker pull haproxy:3.0-alpine
      - name: Verify authentication events with the real Fail2Ban filter
        run: python -m pytest tests/integration/test_advisory_fail2ban.py -q --no-cov
      - name: Verify real SSH and Docker HAProxy certificate recovery
        env:
          ROXYWI_TEST_DOCKER_LE: '1'
        run: python -m pytest tests/integration/test_letsencrypt_linux.py -q --no-cov

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests scheduler_runner.py service_event_consumer.py roxy_wi.py roxy_wi_health.py rotate_credential_secret.py

      - name: Smoke test application startup
        run: python -m pytest tests/smoke -q

      - name: Run service and production database integration tests
        run: python -m pytest tests/integration/test_service_events.py tests/integration/test_service_event_storage.py tests/integration/test_operation_queue.py tests/integration/test_database_bootstrap.py -q

      - name: Verify local section generation without sudo
        run: python -m pytest tests/integration/test_section_playbooks.py -q

      - name: Validate container manifests
        run: |
          docker compose --env-file docker/.env.example -f docker/docker-compose.yml config --quiet
          docker compose --env-file docker/.env.example -f docker/docker-compose.sqlite.yml config --quiet

      - name: Run unit and security tests
        run: python -m pytest --ignore=tests/smoke --cov=app --cov-report=term-missing --cov-fail-under=25
